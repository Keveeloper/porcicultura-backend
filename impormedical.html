<script>
(function () {
  const BTN_SELECTOR = 'button[data-menulist-item]';
  const LINK_SELECTOR = 'a[data-menulist-item]';

  // "estado actual" del menú visible
  let current = { id: null, title: null };

  // historial de títulos para volver con "Atrás"
  const titleStack = [];

  function getTitle(el) {
    return (
      (el.getAttribute('title') || '').trim() ||
      (el.textContent || '').trim() ||
      null
    );
  }

  function getId(el) {
    return (el.getAttribute('data-id') || '').trim() || null;
  }

  function applyFix(root = document) {
    if (!current.title) return;

    // Caso ideal: el <a> del menú trae el mismo data-id del botón seleccionado
    if (current.id) {
      const byId = root.querySelectorAll(`${LINK_SELECTOR}[data-id="${CSS.escape(current.id)}"]`);
      byId.forEach(a => {
        if ((a.textContent || '').trim() !== current.title) {
          a.textContent = current.title;
        }
      });
    }

    // Fallback: si el data-id no coincide, intenta por title
    const byTitle = root.querySelectorAll(`${LINK_SELECTOR}[title="${CSS.escape(current.title)}"]`);
    byTitle.forEach(a => {
      if ((a.textContent || '').trim() !== current.title) {
        a.textContent = current.title;
      }
    });

    // Fallback 2 (opcional): si aún no encontró nada, pero existe algún link tipo "Todo"
    // o el link principal, intentamos corregir el primero que aparezca.
    // (déjalo comentado si no lo necesitas)
    /*
    const first = root.querySelector(LINK_SELECTOR);
    if (first && current.title) first.textContent = current.title;
    */
  }

  function retryApply() {
    setTimeout(() => applyFix(document), 0);
    setTimeout(() => applyFix(document), 50);
    setTimeout(() => applyFix(document), 150);
    setTimeout(() => applyFix(document), 300);
  }

  document.addEventListener('click', (e) => {
    const btn = e.target && e.target.closest ? e.target.closest(BTN_SELECTOR) : null;
    if (!btn) return;

    const id = getId(btn);
    const title = getTitle(btn);

    // Si es el botón Atrás
    if (id === 'back' || title === 'Atrás') {
      const prevTitle = titleStack.pop() || null;

      // Si no hay historial, no hacemos nada
      if (!prevTitle) return;

      // Al volver, el "id" del menú anterior puede variar/ser desconocido,
      // pero el título sí lo sabemos y lo aplicamos.
      current = { id: null, title: prevTitle };
      retryApply();
      return;
    }

    // Si es un botón normal, guardamos el título actual antes de cambiar
    if (current.title) titleStack.push(current.title);

    current = { id, title };
    retryApply();
  }, true);

  // Observer global por re-render/portal del menú
  const observer = new MutationObserver((mutations) => {
    for (const m of mutations) {
      if (m.addedNodes && m.addedNodes.length) {
        applyFix(document);
        break;
      }
    }
  });

  observer.observe(document.body, { childList: true, subtree: true });

  // Primera pasada
  applyFix(document);
})();
</script>

  grid-area: image !important;

  overflow: hidden !important;
}

  max-width: 100% !important;
  height: auto !important;

}

   ================================================== */
.commerce-cart-products article li .item-name {
  grid-area: name !important;
  font-weight: 600 !important;
}


/* ==================================================

   ================================================== */
.commerce-cart-products article li .item-details-pills-qty {
  grid-area: details-pills-qty !important;
  display: flex !important;
  flex-direction: column !important;
  gap: 0.75rem !important;
}

.commerce-cart-products article li
.item-details-pills-qty .product-fields span[part="formatted-rich-text"] {
  display: -webkit-box !important;
  -webkit-line-clamp: 4 !important;
  -webkit-box-orient: vertical !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
  line-height: 1.4 !important;
}
